    <script>
      (function () {
        const path = window.location.pathname;
        const params = new URLSearchParams(window.location.search);
        const redirectPath = params.get('p');

        if ((path === '/' || path === '/index.html') && !redirectPath) {
          var heroPreload = document.createElement('link');
          heroPreload.rel = 'preload';
          heroPreload.as = 'image';
          heroPreload.href = '/dahero.webp';
          heroPreload.fetchPriority = 'high';
          document.head.appendChild(heroPreload);
        }

        if (path.startsWith('/docs')) {
          const route = path.slice('/docs'.length) || '/';
          const search = window.location.search || '';
          const target = `${window.location.origin}${route}${search}${window.location.hash || ''}`;
          window.location.replace(target);
          return;
        }

        if (!redirectPath || redirectPath.includes('://') || redirectPath.startsWith('//')) return;

        const cleanPath = redirectPath.startsWith('/') ? redirectPath : `/${redirectPath}`;
        if (!/^\/[a-z0-9\-/_]*$/i.test(cleanPath)) return;

        const nextUrl = `${window.location.origin}${cleanPath}${window.location.hash || ''}`;
        window.history.replaceState(null, '', nextUrl);
      })();
    </script>
